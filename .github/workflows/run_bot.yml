name: Check Tech Events

on:
  schedule:
    # Tourne toutes les heures à la minute 0 (UTC)
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-notifier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installation des dépendances
        run: |
          pip install requests

      - name: Exécution du script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python ctf_notifier.py

      - name: Sauvegarder les événements vus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_events.json || true
          git diff --staged --quiet || (git commit -m "chore: update seen_events.json" && git push)
